name: Pretest patch

on:
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "scripts/**"
      - "build.sh"
      - ".github/compile-cache-key"
      - ".github/workflows/pretest.yml"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "patches/**"
      - "scripts/**"
      - "build.sh"
      - ".github/compile-cache-key"
      - ".github/workflows/pretest.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SERIES: noble

jobs:
  pretest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Test build scripts (no WebKit compile)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq devscripts zstd binutils-gold
          chmod +x ./scripts/test-build-scripts.sh ./scripts/pretest-patch.sh
          ./scripts/test-build-scripts.sh
