name: Pretest patch

on:
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "scripts/**"
      - ".github/**"
      - "build.sh"
      - ".github/workflows/pretest.yml"
      - ".github/workflows/build-resolute.yml"
      - ".github/workflows/build-questing.yml"
      - ".github/workflows/build-plucky.yml"
      - ".github/workflows/monitor-upstream.yml"
  pull_request:
    paths:
      - "patches/**"
      - "scripts/**"
      - ".github/**"
      - "build.sh"
      - ".github/workflows/pretest.yml"
      - ".github/workflows/build-resolute.yml"
      - ".github/workflows/build-questing.yml"
      - ".github/workflows/build-plucky.yml"
      - ".github/workflows/monitor-upstream.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pretest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        series: [plucky, questing, resolute]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch or restore pretest fixtures
        uses: actions/cache@v5
        with:
          path: fixtures/
          key: fixtures-${{ matrix.series }}-${{ hashFiles('.github/pinned-webkit-version', 'patches/webkit-*.patch', 'patches/webkitgtk-variant-suffix.patch', 'scripts/fetch-fixtures.sh', 'scripts/lib/debian-rules-fixture.sh', 'scripts/lib/webkit-source-fixture.sh') }}

      - name: Populate pretest fixtures
        run: |
          chmod +x ./scripts/fetch-fixtures.sh
          ./scripts/fetch-fixtures.sh ${{ matrix.series }}

      - name: Run pretest
        env:
          SERIES: ${{ matrix.series }}
          SIMULATE_DUMP_DIR: fixture-dump/${{ matrix.series }}
        run: |
          sudo apt-get install -y -qq devscripts debhelper fakeroot zstd binutils-gold curl
          chmod +x ./scripts/run-pretest.sh
          ./scripts/run-pretest.sh ${{ matrix.series }}

      - name: Upload packaging fixture dump
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fixture-dump-${{ matrix.series }}
          path: fixture-dump/${{ matrix.series }}/
          if-no-files-found: ignore
