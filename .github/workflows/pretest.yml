name: Pretest patch

on:
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "scripts/**"
      - ".github/**"
      - "build.sh"
      - ".github/workflows/pretest.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-questing.yml"
      - ".github/workflows/monitor-upstream.yml"
  pull_request:
    paths:
      - "patches/**"
      - "scripts/**"
      - ".github/**"
      - "build.sh"
      - ".github/workflows/pretest.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-questing.yml"
      - ".github/workflows/monitor-upstream.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pretest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        series: [questing, resolute]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Test build scripts (no WebKit compile)
        env:
          SERIES: ${{ matrix.series }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq devscripts zstd binutils-gold
          chmod +x ./scripts/test-build-scripts.sh ./scripts/pretest-patch.sh
          ./scripts/test-build-scripts.sh
