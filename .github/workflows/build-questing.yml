name: Build libwebkitgtk-6.0 (25.10 questing)

# Native questing build: start on ubuntu-24.04 (noble), dist-upgrade to 25.10, then compile.
# Trigger: build-questing-* tags or workflow_dispatch.
on:
  push:
    tags:
      - "build-questing-*"
  workflow_dispatch:
    inputs:
      suffix:
        description: Debian version suffix appended to the Ubuntu package version
        required: true
        default: "+webkitgtk1"
        type: string
      clean:
        description: Wipe work tree before building (ignore restored work cache)
        required: false
        default: false
        type: boolean
      clean_cache:
        description: Also wipe persistent ccache
        required: false
        default: false
        type: boolean
      refresh_apt_cache:
        description: Force a fresh apt archive cache key (re-download packages)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: webkitgtk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APT_CACHE_DIR: .ci-cache/apt-questing
  WORK_CACHE_DIR: .ci-cache/work
  SERIES: questing
  SUFFIX: ${{ github.event.inputs.suffix || '+webkitgtk1' }}
  CLEAN: ${{ github.event.inputs.clean == 'true' && '1' || '0' }}
  CLEAN_CACHE: ${{ github.event.inputs.clean_cache == 'true' && '1' || '0' }}
  REFRESH_APT: ${{ github.event.inputs.refresh_apt_cache == 'true' && '1' || '0' }}
  TRIGGER_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  pretest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Test build scripts (no WebKit compile)
        env:
          SERIES: ${{ env.SERIES }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq devscripts zstd binutils-gold
          chmod +x ./scripts/test-build-scripts.sh ./scripts/pretest-patch.sh
          ./scripts/test-build-scripts.sh

  build:
    needs: pretest
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Free runner disk (remove unused SDKs)
        run: |
          chmod +x .github/scripts/free-runner-disk.sh .github/scripts/work-cache.sh .github/scripts/upgrade-runner-to-series.sh
          .github/scripts/free-runner-disk.sh

      - name: Restore apt package cache
        id: restore-apt
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: apt-webkitgtk-v1-${{ env.REFRESH_APT == '1' && github.run_id || 'stable' }}-${{ env.SERIES }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/build-questing.yml', '.github/scripts/free-runner-disk.sh', '.github/scripts/upgrade-runner-to-series.sh', 'build.sh') }}
          restore-keys: |
            apt-webkitgtk-v1-stable-${{ env.SERIES }}-${{ runner.arch }}-
            apt-webkitgtk-v1-stable-${{ env.SERIES }}-
            apt-webkitgtk-v1-

      - name: Upgrade runner noble → questing
        env:
          TARGET_SERIES: ${{ env.SERIES }}
          BASE_SERIES: noble
          APT_CACHE_DIR: ${{ env.APT_CACHE_DIR }}
        run: .github/scripts/upgrade-runner-to-series.sh

      - name: Save apt package cache
        if: always() && steps.restore-apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: apt-webkitgtk-v1-stable-${{ env.SERIES }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/build-questing.yml', '.github/scripts/free-runner-disk.sh', '.github/scripts/upgrade-runner-to-series.sh', 'build.sh') }}

      - name: Restore ccache
        uses: actions/cache/restore@v5
        id: restore-ccache
        with:
          path: cache/ccache
          key: ccache-${{ env.SERIES }}-${{ runner.arch }}-${{ hashFiles('.github/compile-cache-key') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.SERIES }}-${{ runner.arch }}-${{ hashFiles('.github/compile-cache-key') }}-
            ccache-${{ env.SERIES }}-${{ runner.arch }}-${{ hashFiles('patches/enable-webdriver-gtk4-soup3.patch') }}-
            ccache-${{ env.SERIES }}-${{ runner.arch }}-
            ccache-${{ env.SERIES }}-

      - name: Restore work tree cache (incremental build)
        id: restore-work
        if: ${{ env.CLEAN != '1' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.WORK_CACHE_DIR }}
          key: work-${{ env.SERIES }}-${{ runner.arch }}-${{ env.SUFFIX }}-${{ hashFiles('.github/compile-cache-key') }}-${{ github.run_id }}
          restore-keys: |
            work-${{ env.SERIES }}-${{ runner.arch }}-${{ env.SUFFIX }}-${{ hashFiles('.github/compile-cache-key') }}-
            work-${{ env.SERIES }}-${{ runner.arch }}-${{ env.SUFFIX }}-${{ hashFiles('patches/enable-webdriver-gtk4-soup3.patch') }}-
            work-${{ env.SERIES }}-${{ runner.arch }}-${{ env.SUFFIX }}-
            work-${{ env.SERIES }}-${{ runner.arch }}-

      - name: Unpack work tree
        if: ${{ env.CLEAN != '1' }}
        run: |
          set -euo pipefail
          .github/scripts/work-cache.sh unpack || {
            echo "work-cache unpack failed or empty; starting cold"
            rm -rf work
            mkdir -p work
          }

      - name: Show free disk before build
        run: |
          df -h
          if [[ -d work ]]; then du -sh work work/* 2>/dev/null || true; fi

      - name: Build packages
        id: build
        env:
          SERIES: ${{ env.SERIES }}
          SUFFIX: ${{ env.SUFFIX }}
          CLEAN: ${{ env.CLEAN }}
          CLEAN_CACHE: ${{ env.CLEAN_CACHE }}
          CCACHE_MAXSIZE: 4G
          BUILD_PARALLEL_JOBS: "2"
          CI_BUILD_LIMITS: "1"
          DEB_BUILD_OPTIONS: noautodbgsym nodoc nocheck
          APT_CACHE_DIR: ${{ env.APT_CACHE_DIR }}
          APT_UPGRADE: "0"
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Pack work tree for cache
        id: pack-work
        if: ${{ always() && (steps.build.outcome == 'failure' || steps.build.outcome == 'cancelled') }}
        run: |
          set -euo pipefail
          .github/scripts/work-cache.sh pack

      - name: Save work tree cache
        if: ${{ always() && steps.pack-work.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.WORK_CACHE_DIR }}
          key: work-${{ env.SERIES }}-${{ runner.arch }}-${{ env.SUFFIX }}-${{ hashFiles('.github/compile-cache-key') }}-${{ github.run_id }}

      - name: Save ccache
        if: ${{ always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure' || steps.build.outcome == 'cancelled') }}
        uses: actions/cache/save@v5
        with:
          path: cache/ccache
          key: ccache-${{ env.SERIES }}-${{ runner.arch }}-${{ hashFiles('.github/compile-cache-key') }}-${{ github.run_id }}

      - name: Upload .deb artifacts
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: libwebkitgtk-6.0-${{ env.SERIES }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_TAG: ${{ env.TRIGGER_TAG }}
          SERIES: ${{ env.SERIES }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DEBS=(dist/libwebkitgtk-6.0-4_*.deb)
          if [[ ${#DEBS[@]} -eq 0 ]]; then
            echo "error: no runtime .deb found in dist/" >&2
            exit 1
          fi
          VERSION="$(dpkg-deb -f "${DEBS[0]}" Version)"
          NOTES="Rebuilt Ubuntu webkit2gtk (${SERIES}) with ENABLE_WEBDRIVER for GTK4/libwebkitgtk-6.0 (WebKit #318171).

          Package version: \`${VERSION}\`

          Install alongside system webkit2gtk-driver / webkitgtk-webdriver:

          \`\`\`bash
          sudo apt install ./libwebkitgtk-6.0-4_*.deb
          \`\`\`
          "

          if [[ -n "${TRIGGER_TAG}" ]]; then
            RELEASE_TAG="${TRIGGER_TAG}"
            TITLE="${TRIGGER_TAG} (${VERSION})"
          else
            RELEASE_TAG="webkit2gtk-${VERSION//+/-}"
            TITLE="webkit2gtk-${VERSION}"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.deb --clobber
            gh release edit "$RELEASE_TAG" --notes "$NOTES" || true
          else
            gh release create "$RELEASE_TAG" dist/*.deb \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
          echo "Published to release: $RELEASE_TAG"

      - name: Update tracked upstream version
        if: ${{ steps.build.outcome == 'success' }}
        env:
          SUFFIX: ${{ env.SUFFIX }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DEBS=(dist/libwebkitgtk-6.0-4_*.deb)
          if [[ ${#DEBS[@]} -eq 0 ]]; then
            echo "error: no runtime .deb for tracked version update" >&2
            exit 1
          fi
          pkg_version="$(dpkg-deb -f "${DEBS[0]}" Version)"
          upstream="${pkg_version%$SUFFIX}"
          if [[ "$upstream" == "$pkg_version" ]]; then
            echo "warning: package version $pkg_version did not end with suffix $SUFFIX" >&2
            upstream="${pkg_version%%+*}"
          fi
          echo "==> recording tracked upstream webkit2gtk version: $upstream"
          {
            echo '# Last upstream webkit2gtk source version we successfully built and released.'
            echo '# Updated automatically when a tag-triggered build publishes .debs.'
            echo "$upstream"
          } >.github/tracked-upstream-version
          {
            echo '# Upstream webkit2gtk version queued for an in-flight auto-build (empty = none).'
            echo
          } >.github/pending-upstream-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/tracked-upstream-version .github/pending-upstream-version
          if git diff --staged --quiet; then
            echo "==> tracked upstream version unchanged"
            exit 0
          fi
          git commit -m "Track upstream webkit2gtk $upstream after successful build"
          git push origin HEAD
