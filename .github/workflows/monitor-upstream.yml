name: Monitor upstream webkit2gtk

# Daily: follow archive webkit2gtk for resolute — sync pin, pretest, push build tag.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: Run pretest and queue a build even if upstream matches tracked
        required: false
        default: false
        type: boolean
      dry_run:
        description: Log what would happen without committing, tagging, or pushing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: webkitgtk-monitor-upstream
  cancel-in-progress: false

env:
  SERIES: resolute

jobs:
  monitor:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore upstream Sources index cache
        uses: actions/cache@v5
        with:
          path: .cache/upstream-sources
          key: upstream-sources-${{ env.SERIES }}

      - name: Monitor upstream and queue build if needed
        env:
          SERIES: ${{ env.SERIES }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          FORCE_BUILD: ${{ github.event.inputs.force_build == 'true' && '1' || '0' }}
          UPSTREAM_SOURCES_CACHE_DIR: .cache/upstream-sources
        run: |
          chmod +x ./scripts/upstream-webkit-version.sh ./scripts/monitor-upstream-build.sh
          ./scripts/monitor-upstream-build.sh
